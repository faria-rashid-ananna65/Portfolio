<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Professional developer portfolio showcasing projects, skills, and experience in modern web development technologies." />
    <meta name="keywords" content="portfolio, web developer, frontend developer, React, JavaScript, full stack, MERN, developer portfolio" />
    <meta name="author" content="Developer" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:title" content="Developer Portfolio - Full Stack Web Developer" />
    <meta property="og:description" content="Professional developer portfolio showcasing projects, skills, and experience in modern web development technologies." />
    <meta property="og:image" content="https://yourdomain.com/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://yourdomain.com/" />
    <meta name="twitter:title" content="Developer Portfolio - Full Stack Web Developer" />
    <meta name="twitter:description" content="Professional developer portfolio showcasing projects, skills, and experience in modern web development technologies." />
    <meta name="twitter:image" content="https://yourdomain.com/og-image.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Developer",
        "url": "https://yourdomain.com",
        "jobTitle": "Full Stack Developer",
        "sameAs": []
      }
    </script>

    <title>Developer Portfolio - Full Stack Web Developer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
